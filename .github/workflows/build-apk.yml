# Builds and releases the app automatically.
#
# Every push to main = a new signed release. You only commit and push.
#   Version goes up by itself:  v1.0.0 → v1.1.0 → v1.2.0 → ...
#   Put one of these anywhere in a commit message to change that:
#     [patch]          → small fix: v1.2.0 → v1.2.1
#     [major]          → big change: v1.2.1 → v2.0.0
#     [skip release]   → build only, no new version
# Pull requests are built and tested but not released.
# Nothing is committed back to main, so a plain `git push` always works.
name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # create tags and Releases

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - name: Check out code (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: ver
        run: |
          LAST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          LAST=${LAST:-v1.0.0}
          HERE=$(git tag --points-at HEAD --list 'v[0-9]*' | head -n1)
          MSGS=$(git log --format=%B "$LAST"..HEAD 2>/dev/null || git log -1 --format=%B)

          RELEASE=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then RELEASE=true; fi
          if echo "$MSGS" | grep -qi '\[skip release\]'; then RELEASE=false; fi

          if [ -n "$HERE" ]; then
            NEXT=${HERE#v}            # this commit already has a version (re-run)
            RELEASE=false
          else
            IFS=. read -r MA MI PA <<< "${LAST#v}"
            if echo "$MSGS" | grep -qi '\[major\]'; then MA=$((MA+1)); MI=0; PA=0
            elif echo "$MSGS" | grep -qi '\[patch\]'; then PA=$((PA+1))
            else MI=$((MI+1)); PA=0
            fi
            NEXT="$MA.$MI.$PA"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "Last release $LAST → this build v$NEXT (release: $RELEASE)"

      - name: Releases must be signed
        if: steps.ver.outputs.release == 'true' && env.KEYSTORE_BASE64 == ''
        run: |
          echo "::error::Add the signing key secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS) before releasing."
          exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Make app icons
        run: dart run flutter_launcher_icons

      - name: Check code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Set up signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.ver.outputs.version }} \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }} \
            --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Name the APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/worship-team-v$V.apk"
          # Same file under a fixed name, so ".../releases/latest/download/worship-team.apk" always works
          cp build/app/outputs/flutter-apk/app-release.apk "dist/worship-team.apk"
          ls -l dist

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: worship-team-apk-v${{ steps.ver.outputs.version }}
          path: dist/*.apk
          retention-days: 30

      - name: Write release notes
        if: steps.ver.outputs.release == 'true'
        run: |
          {
            echo "**Download:** \`worship-team.apk\` below. It installs over the previous version; your sign-in stays."
            echo
            echo "### What's new"
            git log --format='- %s' "${{ steps.ver.outputs.last }}"..HEAD | grep -viE '^- (merge|wip)' | sed -E 's/\[(skip release|patch|major)\]//Ig' || true
          } > notes.md
          cat notes.md

      - name: Publish release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Worship Team v${{ steps.ver.outputs.version }}
          body_path: notes.md
          files: dist/*.apk
          make_latest: true

  web:
    # The iPhone / browser version (Flutter web), deployed to Vercel when VERCEL_TOKEN is set.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Build web app
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=APP_VERSION=${{ needs.build.outputs.version }} \
            --dart-define=APP_BUILD=${{ github.run_number }}

      - name: Upload web build (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: worship-team-web-v${{ needs.build.outputs.version }}
          path: build/web
          retention-days: 14

      - name: Deploy to Vercel
        if: env.VERCEL_TOKEN != '' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/worship-team && cp -r build/web /tmp/worship-team
          cd /tmp/worship-team
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
